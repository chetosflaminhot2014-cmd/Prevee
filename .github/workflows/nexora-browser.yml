name: Build Nexora Browser APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'browser/**'
      - 'settings.gradle'
      - '.github/workflows/nexora-browser.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build Nexora APK
        run: ./gradlew :browser:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-Browser-debug-apk
          path: browser/build/outputs/apk/debug/browser-debug.apk
          if-no-files-found: error
          retention-days: 14
